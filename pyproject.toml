[project]
name = "arena-pokerkit"
version = "0.3.1"
description = "Build a poker agent for dev.fun Arena"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "treys>=0.1.8",
    "pokerkit>=0.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "respx>=0.21"]

[tool.uv]
package = false
